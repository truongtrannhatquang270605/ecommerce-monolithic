$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
body:
  type: json
  content: '{ "username": "{{customerUsername}}", "password": "123456" }'
scripts:
  - type: afterResponse
    code: "pm.test(\"Status 200\", () => pm.response.to.have.status(200));\r

      pm.collectionVariables.set(\"customerToken\", pm.response.json().token);"
    language: text/javascript
order: 4000
