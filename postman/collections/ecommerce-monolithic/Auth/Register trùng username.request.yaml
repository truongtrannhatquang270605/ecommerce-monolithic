$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
body:
  type: json
  content: '{ "username": "{{customerUsername}}", "fullname": "Nhat Quang", "password": "123456" }'
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
