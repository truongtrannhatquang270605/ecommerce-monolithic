$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: PUT
body:
  type: json
  content: '{ "price": 120000 }'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
