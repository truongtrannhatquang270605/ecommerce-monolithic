$kind: http-request
url: "{{baseUrl}}/products"
method: POST
body:
  type: json
  content: '{ "pname": "Mũ lưỡi trai", "price": 99000, "quantity": 20 }'
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
