$kind: http-request
url: "{{baseUrl}}/shipments/{{shipmentId}}"
method: PUT
body:
  type: json
  content: '{ "status": "SHIPPING" }'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
