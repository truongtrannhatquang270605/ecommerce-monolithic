$kind: http-request
url: "{{baseUrl}}/shipments"
method: POST
body:
  type: json
  content: '{ "oid": {{orderId}} }'
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000
