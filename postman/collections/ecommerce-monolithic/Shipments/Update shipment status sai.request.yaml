$kind: http-request
url: "{{baseUrl}}/shipments/{{shipmentId}}"
method: PUT
body:
  type: json
  content: '{ "status": "BAY_MAT" }'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
