$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
body:
  type: json
  content: '{ "items": [] }'
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
